# CI - quality gates for every pull request and every push to main.
# A pull request can only be merged when all jobs are green (branch protection).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read              # least privilege: the token can only read the code

jobs:
  # Gate 1 + 2: lint and tests run in parallel with the other jobs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                     # dependency cache: pip packages are reused between runs
      - run: pip install -r requirements.txt ruff pytest pytest-cov
      - name: Lint (0 errors allowed)
        run: ruff check .
      - name: Tests (coverage must be at least 80%)
        run: pytest --cov=app --cov-fail-under=80

  # Gate 3: security scan of the source code and dependencies
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets and vulnerable packages (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: "1"                 # any critical/high finding fails the build

  # Gate 4: the Docker image must build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                    # pull requests never publish images
          tags: vetcare:ci
          cache-from: type=gha           # reuse unchanged Docker layers
          cache-to: type=gha,mode=max
