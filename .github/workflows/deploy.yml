# Deploy - build the image once, then deploy it.
#   push to main   -> build + push image -> deploy to STAGING (automatic)
#   tag v1.2.3     -> deploy the same image to PRODUCTION (needs approval)
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vetcare

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                    # only this job may push images
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # short-lived token, no stored password
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}   # every image is tagged with its commit
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging                 # secrets for staging live here
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and roll back automatically if it fails
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl set image deployment/vetcare vetcare="$IMAGE:$GITHUB_SHA"
          kubectl rollout status deployment/vetcare --timeout=180s || {
            kubectl rollout undo deployment/vetcare      # instant rollback
            exit 1
          }

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production              # required reviewer must approve before this job starts
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the tested image and roll back automatically if it fails
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube && echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl set image deployment/vetcare vetcare="$IMAGE:$GITHUB_SHA"   # same image as staging, no rebuild
          kubectl rollout status deployment/vetcare --timeout=180s || {
            kubectl rollout undo deployment/vetcare
            exit 1
          }
